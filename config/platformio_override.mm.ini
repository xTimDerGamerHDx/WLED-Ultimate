; WLED Ultimate - MoonModules integration channel
; Source: MoonModules/WLED-MM:mdev

[ultimate_mm]
build_flags =
  -D WLED_ULTIMATE=1
  -D WLED_ULTIMATE_MM=1
  -D WLED_ULTIMATE_CHANNEL=\"mm\"
  -D USERMOD_WLED_ULTIMATE
  -D WLED_ULTIMATE_ADVANCED_AUDIO=1
  -D WLED_ULTIMATE_PARTICLE_FX=1
  -D WLED_ULTIMATE_AUDIO_PARTICLE_FX=1
  -D WLED_ULTIMATE_MM_EFFECTS=1
  -D WLED_ULTIMATE_AUDIO_UDP_SYNC=1
  -D WLED_ULTIMATE_HIGH_PERFORMANCE=1
  -D WLED_ULTIMATE_EXPERIMENTAL_FX=1

[env:ultimate_esp32_4mb]
extends = env:esp32_4MB_V4_M
build_flags =
  ${env:esp32_4MB_V4_M.build_flags}
  ${ultimate_mm.build_flags}

[env:ultimate_esp32_4mb_eth]
extends = env:esp32_4MB_V4_S_eth
build_flags =
  ${env:esp32_4MB_V4_S_eth.build_flags}
  ${ultimate_mm.build_flags}
  -D WLED_ULTIMATE_ETHERNET=1

; Gledopto Elite 4D-EXMU Advanced WLED Controller (GL-C-618WL)
; Classic ESP32 / 4 MB / LAN8720 Ethernet / built-in PDM microphone.
; LED data outputs: GPIO16, GPIO12, GPIO4, GPIO2
; Extra GPIO: GPIO13
; Button: GPIO17
; Relay: GPIO18, active-low/inverted
; PDM microphone: SD GPIO32, WS GPIO15
; Gledopto Ethernet profile = WLED_ETH_GLEDOPTO (13)
[env:ultimate_gledopto_gl_c_618wl]
extends = env:esp32_4MB_V4_S_eth
build_flags =
  ${env:esp32_4MB_V4_S_eth.build_flags}
  ${ultimate_mm.build_flags}
  -D WLED_ULTIMATE_ETHERNET=1
  -D WLED_ULTIMATE_GLEDOPTO_GL_C_618WL=1
  -D WLED_ETH_DEFAULT=13
  -D BTNPIN=17
  -D RLYPIN=18
  -D RLYMDE=0

[env:ultimate_esp32_16mb_eth]
extends = env:esp32_16MB_V4_M_eth
build_flags =
  ${env:esp32_16MB_V4_M_eth.build_flags}
  ${ultimate_mm.build_flags}
  -D WLED_ULTIMATE_ETHERNET=1

[env:ultimate_esp32s3_8mb_psram]
extends = env:esp32S3_8MB_PSRAM_M_opi
build_flags =
  ${env:esp32S3_8MB_PSRAM_M_opi.build_flags}
  ${ultimate_mm.build_flags}
  -D WLED_ULTIMATE_PSRAM=1

[env:ultimate_esp32s3_16mb_hub75]
extends = env:esp32S3_16MB_PSRAM_M_HUB75
build_flags =
  ${env:esp32S3_16MB_PSRAM_M_HUB75.build_flags}
  ${ultimate_mm.build_flags}
  -D WLED_ULTIMATE_PSRAM=1
