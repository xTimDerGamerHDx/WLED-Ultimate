; WLED Ultimate - upstream development channel
; Source: wled/WLED:main
; This is intentionally named 17dev until upstream publishes an actual stable v17 release.

[ultimate_wled17]
build_flags =
  -D WLED_ULTIMATE=1
  -D WLED_ULTIMATE_17DEV=1
  -D WLED_ULTIMATE_CHANNEL=\"17dev\"
  -D WLED_ULTIMATE_ADVANCED_AUDIO=1
  -D WLED_ULTIMATE_PARTICLE_FX=1
  -D WLED_ULTIMATE_AUDIO_UDP_SYNC=1
  -D WLED_ULTIMATE_HIGH_PERFORMANCE=1
  -D WLED_ULTIMATE_EXPERIMENTAL_FX=1

[env:ultimate_wled17_esp32]
extends = env:esp32dev_V4
custom_usermods =
  ${env:esp32dev_V4.custom_usermods}
  WLED_Ultimate
build_flags =
  ${env:esp32dev_V4.build_flags}
  ${ultimate_wled17.build_flags}

[env:ultimate_wled17_esp32_eth]
extends = env:esp32_eth_V4
custom_usermods =
  ${env:esp32_eth_V4.custom_usermods}
  WLED_Ultimate
build_flags =
  ${env:esp32_eth_V4.build_flags}
  ${ultimate_wled17.build_flags}
  -D WLED_ULTIMATE_ETHERNET=1

[env:ultimate_wled17_esp32s3_8mb]
extends = env:esp32s3dev_8MB_opi
custom_usermods =
  ${env:esp32s3dev_8MB_opi.custom_usermods}
  WLED_Ultimate
build_flags =
  ${env:esp32s3dev_8MB_opi.build_flags}
  ${ultimate_wled17.build_flags}
  -D WLED_ULTIMATE_PSRAM=1

[env:ultimate_wled17_esp32s3_16mb]
extends = env:esp32s3dev_16MB_opi
custom_usermods =
  ${env:esp32s3dev_16MB_opi.custom_usermods}
  WLED_Ultimate
build_flags =
  ${env:esp32s3dev_16MB_opi.build_flags}
  ${ultimate_wled17.build_flags}
  -D WLED_ULTIMATE_PSRAM=1
